<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SQL Formatter — Formateador y embellecedor de SQL</title>
<meta name="description" content="Formatea, embellece y colorea instrucciones SQL directamente en tu navegador. Inspirado en poorsql.com">
<style>
  :root {
    --bg: #eef2f7;
    --card: #ffffff;
    --border: #dbe2ea;
    --text: #1f2937;
    --muted: #6b7280;
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --danger: #dc2626;
    --code-bg: #1e293b;
    --code-text: #e2e8f0;
    --mono: 'Cascadia Code', 'JetBrains Mono', Consolas, 'Courier New', monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); }

  header { background: linear-gradient(135deg, #1e3a8a, #2563eb); color: #fff; padding: 30px 0 44px; }
  header h1 { margin: 0 0 6px; font-size: 1.75rem; }
  header p { margin: 0; opacity: .88; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; margin-top: -24px; padding-bottom: 30px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 4px 14px rgba(15, 23, 42, .07); }
  .editor-card { overflow: hidden; }

  .tabs { display: flex; gap: 4px; padding: 10px 12px 0; border-bottom: 1px solid var(--border); background: #f8fafc; }
  .tab { border: 1px solid transparent; border-bottom: none; background: transparent; padding: 9px 16px; border-radius: 8px 8px 0 0; cursor: pointer; font-size: .9rem; color: var(--muted); }
  .tab:hover { color: var(--text); }
  .tab.active { background: var(--card); border-color: var(--border); color: var(--primary); font-weight: 600; margin-bottom: -1px; }

  .pane { display: none; }
  .pane.active { display: block; }
  textarea#inputSql {
    width: 100%; min-height: 470px; border: none; outline: none; resize: vertical;
    padding: 16px; font-family: var(--mono); font-size: 13.5px; line-height: 1.55;
    background: var(--code-bg); color: var(--code-text); display: block;
  }
  pre.code {
    margin: 0; min-height: 470px; max-height: 72vh; overflow: auto; padding: 16px;
    font-family: var(--mono); font-size: 13.5px; line-height: 1.55;
    background: var(--code-bg); color: var(--code-text); white-space: pre;
  }
  pre.code .kw  { color: #569cd6; font-weight: 600; }
  pre.code .fn  { color: #dcdcaa; }
  pre.code .str { color: #ce9178; }
  pre.code .cm  { color: #6a9955; font-style: italic; }
  pre.code .num { color: #b5cea8; }

  .actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px; border-top: 1px solid var(--border); background: #f8fafc; }
  .btn { border: 1px solid var(--border); background: #fff; border-radius: 8px; padding: 8px 14px; cursor: pointer; font-size: .88rem; color: var(--text); }
  .btn:hover { background: #f1f5f9; }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }
  .btn.primary:hover { background: var(--primary-dark); }
  .btn.danger { color: var(--danger); }

  .options-card { padding: 18px; align-self: start; }
  .options-card h2 { margin: 0 0 4px; font-size: 1.05rem; }
  .opt-group { display: flex; flex-direction: column; gap: 9px; padding: 13px 0; border-top: 1px solid var(--border); font-size: .88rem; }
  .opt-group:first-of-type { border-top: none; }
  .opt-title { font-weight: 600; color: var(--muted); font-size: .76rem; text-transform: uppercase; letter-spacing: .05em; margin-top: 4px; }
  .opt-group label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .opt-group select, .opt-group input[type=number] { padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: .88rem; width: 100%; background: #fff; }
  .opt-group input[type=checkbox], .opt-group input[type=radio] { accent-color: var(--primary); }

  footer { text-align: center; color: var(--muted); font-size: .82rem; padding: 10px 20px 28px; }
  footer a { color: var(--primary); }

  @media (max-width: 940px) {
    .layout { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>🛠️ SQL Formatter</h1>
    <p>Formatea, embellece y colorea tus instrucciones SQL — inspirado en poorsql.com. Todo se procesa localmente en tu navegador.</p>
  </div>
</header>

<main class="wrap layout">
  <section class="card editor-card">
    <div class="tabs">
      <button class="tab active" data-target="pane-input">SQL de entrada</button>
      <button class="tab" data-target="pane-output">SQL formateado</button>
      <button class="tab" data-target="pane-html">Código HTML</button>
    </div>

    <div id="pane-input" class="pane active">
      <textarea id="inputSql" spellcheck="false" placeholder="Pega aquí tu SQL desordenado, luego presiona Ctrl+Enter o el botón Formatear. ¡Juega con las opciones de la derecha!"></textarea>
    </div>
    <div id="pane-output" class="pane">
      <pre class="code"><code id="outputCode"></code></pre>
    </div>
    <div id="pane-html" class="pane">
      <pre class="code"><code id="htmlCode"></code></pre>
    </div>

    <div class="actions">
      <button id="btnFormat" class="btn primary">✨ Formatear (Ctrl+Enter)</button>
      <button id="btnCopy" class="btn">📋 Copiar SQL</button>
      <button id="btnCopyHtml" class="btn">📋 Copiar HTML</button>
      <button id="btnSample" class="btn">📝 Cargar ejemplo</button>
      <button id="btnClear" class="btn danger">🗑️ Limpiar</button>
    </div>
  </section>

  <aside class="card options-card">
    <h2>Opciones</h2>

    <div class="opt-group">
      <span class="opt-title">Modo</span>
      <label><input type="radio" name="mode" value="full" checked> Formateo completo</label>
      <label><input type="radio" name="mode" value="colorize"> Solo colorear</label>
      <label><input type="radio" name="mode" value="minify"> Ofuscar / Minificar</label>
    </div>

    <div class="opt-group">
      <span class="opt-title">Sangría</span>
      <select id="indent">
        <option value="2" selected>2 espacios</option>
        <option value="4">4 espacios</option>
        <option value="tab">Tabulador</option>
      </select>
      <span class="opt-title">Palabras clave</span>
      <select id="kwCase">
        <option value="upper" selected>MAYÚSCULAS</option>
        <option value="lower">minúsculas</option>
        <option value="keep">Sin cambios</option>
      </select>
      <span class="opt-title">Saltos entre sentencias</span>
      <input type="number" id="stmtBreaks" min="1" max="5" value="2">
    </div>

    <div class="opt-group">
      <label><input type="checkbox" id="optCommas" checked> Expandir listas con comas</label>
      <label><input type="checkbox" id="optTrailing" checked> Comas al final de línea</label>
      <label><input type="checkbox" id="optSpaceComma" checked> Espacio después de coma</label>
      <label><input type="checkbox" id="optBool" checked> Expandir expresiones booleanas (AND/OR)</label>
      <label><input type="checkbox" id="optCase" checked> Expandir expresiones CASE</label>
      <label><input type="checkbox" id="optBetween"> Expandir condiciones BETWEEN</label>
      <label><input type="checkbox" id="optIn" checked> Expandir listas IN</label>
      <label><input type="checkbox" id="optJoinOn" checked> Romper secciones JOIN … ON</label>
      <label><input type="checkbox" id="optComments" checked> Preservar comentarios</label>
      <label><input type="checkbox" id="optColor" checked> Habilitar coloreado</label>
    </div>
  </aside>
</main>

<footer>
  Inspirado en <a href="https://poorsql.com" target="_blank" rel="noopener">poorsql.com</a> · HTML/CSS/JS puro, sin dependencias · 100% del lado del cliente
</footer>

<script src="formatter.js"></script>
<script src="app.js"></script>
</body>
</html>
